<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Card</title>
    <meta name="description" content="Meet Snortleblat, a level 5 Swamp Beast Diplomat.">
    <link href="charactercard.css" rel="stylesheet">
    <script src="charactercard.js" defer></script>
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Character Card">
    <meta property="og:description" content="Snortleblat character card">
    <meta property="og:url" content="https://lleatitagaloa.github.io/wdd131/charactercard">
    <meta property="og:image" content="https://lleatitagaloa.github.io/wdd131/charactercard/images/socialpreview.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Character Card">
    <meta name="twitter:description" content="Snortleblat character card">
    <meta name="twitter:image" content="https://lleatitagaloa.github.io/wdd131/charactercard/images/socialpreview.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
</head>
<body>
    <article class="card">
        <img class="image" width="400" height="400">
        <h2 class="name"></h2>
        <section class="stats">
            <p id="class">Class</p>
            <p id="level">Level</p>
            <p id="health">Health</p>
        </section>
        <section class="buttons">
            <button id="attacked">Attacked</button>
            <button id="levelUp">Level Up</button>
        </section>
    </article>
</body>
</html>
